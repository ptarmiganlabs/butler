name: ci
on:
    workflow_dispatch:
        inputs:
            # Builds, signs and notarizes the macOS binary of the dispatched commit, then stops:
            # nothing is released, and the zip is kept as a workflow artifact for three days. The
            # only way to prove the signing on macos-15 before a release depends on it. Dispatch it
            # on master; the release-signing environment admits no other branch:
            #
            #   gh workflow run ci.yaml --ref master -f rehearse_signing=true
            rehearse_signing:
                description: Build, sign and notarize the macOS binary, and release nothing
                type: boolean
                default: false
    push:
        branches:
            - master
permissions: {}
jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            release_tag_name: ${{ steps.release.outputs['tag_name'] }}
            release_version: ${{ steps.release.outputs['version'] }}
            release_upload_url: ${{ steps.release.outputs['upload_url'] }}
        env:
            GITHUB_REF: ${{ github.ref }}
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
            DIST_FILE_NAME: butler
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: Show github.ref
              run: echo "$GITHUB_REF"

            - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
              id: release
              if: github.repository_owner == 'ptarmiganlabs'
              with:
                  token: ${{ secrets.RELEASE_PLEASE_PAT }}
                  # optional. customize path to release-please-config.json
                  config-file: release-please-config.json
                  # optional. customize path to .release-please-manifest.json
                  manifest-file: .release-please-manifest.json
                  target-branch: master

            - name: Show output from Release-Please
              if: false
              env:
                  RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
              run: echo "$RELEASE_PLEASE_OUTPUT"

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: true

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  node -v
                  npm ci --include=dev --include=prod

            - name: Install tool for creating stand-alone API html docs file
              run: |
                  npm i -g @redocly/cli@latest

            - name: Generate latest API doc files and convert to standalone html. Also commit back to GitHub repo
              run: |
                  pwd
                  ls -la
                  node src/butler.js -c ./src/config/config-gen-api-docs.yaml --no-qs-connection &
                  sleep 20
                  echo "...1"
                  curl localhost:8081/documentation/json > ./docs/api_doc/butler-api.json
                  echo "...4"
                  curl localhost:8081/documentation/yaml > ./docs/api_doc/butler-api.yaml
                  echo "...5"
                  ls -la ./docs/api_doc
                  npx @redocly/cli build-docs ./docs/api_doc/butler-api.yaml --output ./docs/api_doc/butler-api.html
                  pkill -f 'node src/butler.js'
                  git config --global user.name 'GitHub action'
                  git config --global user.email 'mountaindude@users.noreply.github.com'
                  git add ./docs/api_doc/butler-api.json
                  git add ./docs/api_doc/butler-api.yaml
                  git add ./docs/api_doc/butler-api.html
                  git commit -m "Auto-adding API docs" --allow-empty
                  git push

    sbom-build:
        permissions:
            contents: write
        needs: release-please
        runs-on: ubuntu-latest

        if: needs.release-please.outputs.releases_created == 'true'
        env:
            DIST_FILE_NAME: butler

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  npm ci --include=prod

            - name: Generate SBOM
              run: |
                  curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
                  chmod +x $RUNNER_TEMP/sbom-tool

                  mkdir -p ./build

                  $RUNNER_TEMP/sbom-tool generate -b ./build -bc . -pn ${DIST_FILE_NAME} -pv ${{ needs.release-please.outputs.release_version }} -ps "Ptarmigan Labs" -nsb https://sbom.ptarmiganlabs.com -V verbose

            - name: List generated SBOM files (debug)
              run: |
                  echo "=== Build directory structure ==="
                  find ./build -type f -name "*.json" -o -name "*.spdx*" | head -20
                  echo "=== File sizes ==="
                  find ./build -type f -name "*.json" -o -name "*.spdx*" -exec ls -la {} \;

            - name: Upload SBOM to Release
              uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  # artifactContentType: raw
                  draft: true
                  artifacts: './build/**/*.spdx.json'
                  token: ${{ github.token }}
                  tag: ${{ needs.release-please.outputs.release_tag_name }}

            - name: Upload SBOM as Workflow Artifact (backup)
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: sbom-${{ needs.release-please.outputs.release_version }}
                  path: './build/'
                  retention-days: 3

    # On a GitHub-hosted runner: butler is public, and the organisation's self-hosted runner
    # groups do not admit public repositories, so a job asking for the build Mac never starts
    # (plabs-house-rules, rules/ci/public-repositories.md). Each run gets a fresh VM, so nothing
    # the signing leaves behind outlives the job.
    release-macos-arm64:
        permissions:
            contents: write
        needs: release-please
        runs-on: macos-15
        # For its deployment policy, which admits master and nothing else, so that only merged code
        # signs with the production identity. The Apple secrets are organisation secrets, which an
        # environment does not scope.
        environment: release-signing
        timeout-minutes: 30

        if: >-
            needs.release-please.outputs.releases_created == 'true'
            || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing)
        env:
            DIST_FILE_NAME: butler
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
        # The Apple secrets are on the step that signs, not on the job. As job env they reached
        # every step here: setup-node, npm ci with its dependencies' install scripts, and the
        # third-party action that attaches the zip. scripts/test/release-kit.test.js holds them to
        # that one step.
        steps:
            - name: Release tag and upload url from previous job
              run: |
                  echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
                  echo "version    : ${{ needs.release-please.outputs.release_version }}"
                  echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  pwd
                  npm ci --include=dev --include=prod

            # A release's zip is named for its version. A rehearsal has none, so its zip is named for
            # the commit, and cannot be mistaken for a release's.
            - name: Name the build
              id: name
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
              run: |
                  if [ -n "$RELEASE_VERSION" ]; then version="$RELEASE_VERSION"; else version="rehearsal-${GITHUB_SHA:0:7}"; fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "building $version"

            - name: Build, sign and notarize
              env:
                  RELEASE_VERSION: ${{ steps.name.outputs.version }}
                  MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
                  MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
                  PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
                  PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
                  PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
              run: bash ./scripts/release-macos.sh

            - name: Upload release artifacts to GitHub
              if: needs.release-please.outputs.releases_created == 'true'
              uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  artifactContentType: raw
                  # artifactContentType: application/zip
                  draft: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  artifacts: ./butler-${{ needs.release-please.outputs.release_version }}-macos-arm64.zip
                  token: ${{ github.token }}

            - name: Keep the rehearsal's zip
              if: needs.release-please.outputs.releases_created != 'true'
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: butler-${{ steps.name.outputs.version }}-macos-arm64
                  path: ./butler-${{ steps.name.outputs.version }}-macos-arm64.zip
                  retention-days: 3
                  if-no-files-found: error

    release-win64:
        permissions:
            contents: write
        needs: release-please
        runs-on:
            - self-hosted
            - x64
            - windows
            - sp53
            - win-code-sign
        # timeout-minutes: 15
        if: needs.release-please.outputs.releases_created == 'true'
        env:
            DIST_FILE_NAME: butler
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
            CODESIGN_WIN_THUMBPRINT: ${{ secrets.WIN_CODESIGN_THUMBPRINT}}
        steps:
            - name: Release tag and upload url from previous job
              run: |
                  Write-Output 'tag_name        : ${{ needs.release-please.outputs.release_tag_name }}'
                  Write-Output 'version         : ${{ needs.release-please.outputs.release_version }}'
                  Write-Output 'upload_url      : ${{ needs.release-please.outputs.release_upload_url }}'

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  pwd
                  npm ci --include=dev --include=prod

            - name: Build binaries
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
              run: ./scripts/release-win.ps1

            - name: Upload to existing release
              uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  artifactContentType: raw
                  # artifactContentType: application/zip
                  draft: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  artifacts: ./butler-${{ needs.release-please.outputs.release_version }}-win.zip
                  token: ${{ github.token }}

            - name: Tidy up before existing
              run: |
                  dir
                  Remove-Item -Path "./build" -Recurse -Force -ErrorAction SilentlyContinue
                  del "./${env:DIST_FILE_NAME}.exe"
                  del "./${env:DIST_FILE_NAME}-${{ needs.release-please.outputs.release_version }}-win.zip"

    release-linux:
        permissions:
            contents: write
        needs: release-please
        runs-on: ubuntu-latest
        # timeout-minutes: 15

        if: needs.release-please.outputs.releases_created == 'true'
        env:
            DIST_FILE_NAME: butler
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
        steps:
            - name: Release tag and upload url from previous job
              run: |
                  echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
                  echo "version    : ${{ needs.release-please.outputs.release_version }}"
                  echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  pwd
                  npm ci --include=dev --include=prod

            - name: Build binaries
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
              run: bash ./scripts/release-linux.sh

            - name: Upload to existing release
              uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  artifactContentType: raw
                  # artifactContentType: application/zip
                  draft: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  artifacts: ./butler-${{ needs.release-please.outputs.release_version }}-linux.zip
                  token: ${{ github.token }}

            - name: Tidy up before existing
              run: |
                  pwd
                  ls -la
                  rm -r build
                  rm "./${DIST_FILE_NAME}"
                  rm "./${DIST_FILE_NAME}-${{ needs.release-please.outputs.release_version }}-linux.zip"
