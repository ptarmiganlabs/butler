name: insiders-build
on:
    workflow_dispatch:
    push:
        branches:
            - master
permissions: {}
jobs:
    insiders-build:
        permissions:
            contents: read
            security-events: write
        strategy:
            matrix:
                os: [windows-latest, macos-15, ubuntu-latest]
                include:
                    # On a GitHub-hosted runner: butler is public, and the organisation's
                    # self-hosted runner groups do not admit public repositories, so the
                    # win-code-sign runner this leg asked for never started. Not signed: insiders
                    # builds are for testing, and only a release is signed, in ci.yaml.
                    - os: windows-latest
                      artifact_insider: butler--win-x64--${{ github.sha }}.zip

                    # Arm 64 build, on a GitHub-hosted runner: butler is public, and the
                    # organisation's self-hosted runner groups do not admit public repositories
                    # (plabs-house-rules, rules/ci/public-repositories.md).
                    - os: macos-15
                      artifact_insider: butler--macos-arm64--${{ github.sha }}.zip

                    - os: ubuntu-latest
                      artifact_insider: butler--linux-x64--${{ github.sha }}.zip

        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  pwd
                  npm ci --include=dev --include=prod

            - name: Run unit tests
              run: npm run test:ci

            - name: Run Snyk to check for vulnerabilities
              # Snyk can be used to break the build when it detects security issues.
              # In this case we want to upload the SAST issues to GitHub Code Scanning
              #uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
              if: |
                  github.repository_owner == 'ptarmiganlabs' &&
                  matrix.os == 'ubuntu-latest'
              continue-on-error: true
              uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # unpinned release; no version tag available
              env:
                  # This is where you will need to introduce the Snyk API token created with your Snyk account
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --file=./package.json --sarif-file-output=snyk.sarif
                  # command: test

            - name: Upload Snyk result to GitHub Code Scanning
              if: |
                  github.repository_owner == 'ptarmiganlabs' &&
                  matrix.os == 'ubuntu-latest'
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
              with:
                  sarif_file: snyk.sarif

            # Unsigned, so this step needs no secret at all.
            - name: Create binaries (Windows)
              if: matrix.os == 'windows-latest'
              env:
                  DIST_FILE_NAME: butler
              run: ./scripts/insider-build-win.ps1

            # Signed ad hoc, not with the Developer ID, and not notarized: insiders builds are
            # for testing (plabs-house-rules, rules/ci/public-repositories.md). So this step
            # needs no secret at all.
            - name: Create binaries (macOS)
              if: matrix.os == 'macos-15'
              env:
                  DIST_FILE_NAME: butler
              run: bash ./scripts/insider-build-mac.sh

            - name: Create binaries (Linux)
              if: matrix.os == 'ubuntu-latest'
              env:
                  DIST_FILE_NAME: butler
                  GITHUB_TOKEN: ${{ secrets.PAT }}
              run: bash ./scripts/insider-build-linux.sh

            - name: Upload insider build artifacts to GitHub
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: ${{ matrix.artifact_insider }}
                  path: ${{ matrix.artifact_insider }}

    deploy-windows-insider:
        permissions:
            actions: read
        needs: insiders-build
        runs-on: ${{ vars.BUTLER_INSIDER_DEPLOY_RUNNER || 'host2-win' }}
        if: success()
        env:
            BUTLER_INSIDER_SERVICE_NAME: ${{ vars.BUTLER_INSIDER_SERVICE_NAME || 'Butler insiders build' }}
            BUTLER_INSIDER_DEPLOY_PATH: ${{ vars.BUTLER_INSIDER_DEPLOY_PATH || 'C:\butler-insider' }}
            BUTLER_INSIDER_SERVICE_TIMEOUT: ${{ vars.BUTLER_INSIDER_SERVICE_TIMEOUT || '30' }}
            BUTLER_INSIDER_DOWNLOAD_PATH: ${{ vars.BUTLER_INSIDER_DOWNLOAD_PATH || './download' }}
        steps:
            - name: Download Windows insider build artifact
              uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
              with:
                  name: butler--win-x64--${{ github.sha }}.zip
                  path: ${{ env.BUTLER_INSIDER_DOWNLOAD_PATH }}

            - name: Deploy Windows insider build
              shell: powershell
              continue-on-error: true
              env:
                  RUNNER_NAME: ${{ runner.name }}
                  GITHUB_SHA: ${{ github.sha }}
              run: ./scripts/deploy-insider-win.ps1

            - name: Verify deployment
              shell: powershell
              continue-on-error: true
              run: ./scripts/verify-insider-deploy.ps1

            - name: Check for errors in log files
              shell: powershell
              continue-on-error: true
              run: ./scripts/check-insider-logs.ps1
